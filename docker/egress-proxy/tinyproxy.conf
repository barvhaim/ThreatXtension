# Egress allowlist proxy for ThreatXtension scans.
# Default-deny: only the Filter hosts below may be reached; everything else 403s.

# No User/Group drop: the proxy is already isolated in its own container with
# cap_drop:ALL and a read-only rootfs, and privilege-drop fails without CAP_SETGID.
Port 8888
Timeout 600

# CONNECT is required for HTTPS tunnelling; restrict to 443.
ConnectPort 443

# --- Allowlist ---
# FilterDefaultDeny yes  => only hosts matching the filter file are allowed.
Filter "/tmp/allowlist.txt"
FilterDefaultDeny Yes
FilterType ere
FilterCaseSensitive Off
# Match against the CONNECT/Host target, not a reverse DNS lookup.
FilterURLs Off

LogLevel Warning
# Writable paths under a read-only rootfs (mounted as tmpfs in compose).
PidFile "/tmp/tinyproxy.pid"
